<!DOCTYPE html>
<html lang="ja">
 <link rel="stylesheet" href="style.css">   
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>世界気温取得状況マップ</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
}

#map {
    width: 100%;
    height: 100vh;
}

.title {
    position: absolute;
    top: 10px;
    left: 60px;
    z-index: 1000;
    background: rgba(255,255,255,0.9);
    padding: 8px 14px;
    border-radius: 6px;
    font-family: sans-serif;
    font-size: 18px;
    font-weight: bold;
}

.legend {
    position: absolute;
    bottom: 20px;
    left: 20px;
    z-index: 1000;
    background: rgba(255,255,255,0.9);
    padding: 10px;
    border-radius: 6px;
    font-family: sans-serif;
}

.legend-item {
    margin: 5px 0;
}

.green {
    color: green;
}

.red {
    color: red;
}
</style>

</head>

<body>

<div class="title">
世界気温取得状況マップ
</div>
<div class="search-box">

   <input
    type="text"
    id="citySearch"
    placeholder="都市名検索">

<div id="suggestions"></div> 

    <datalist id="cityList"></datalist>

    <button onclick="searchCity()">
        検索
    </button>

</div>
<div id="stats" class="stats">
読み込み中...
</div>

</div>

<div class="legend">
<div class="legend-item green">● 取得済</div>
<div class="legend-item red">● 未取得</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="app.js"></script>

</body>
</html>
